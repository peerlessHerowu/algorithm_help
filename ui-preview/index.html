<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算法深度理解引擎 — UI方案对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #eee; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(17,17,17,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
.nav a { color: #999; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: all 0.15s; }
.nav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
.nav a.active { color: #fff; background: rgba(255,255,255,0.1); }
.nav .title { font-weight: 700; color: #fff; margin-right: 24px; font-size: 14px; }
main { padding-top: 60px; }
iframe { width: 100%; height: 100vh; border: none; }
.page-selector { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(17,17,17,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; display: flex; gap: 4px; }
.page-selector button { background: transparent; border: none; color: #999; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.page-selector button:hover { color: #fff; background: rgba(255,255,255,0.06); }
.page-selector button.active { color: #fff; background: rgba(255,255,255,0.12); }
</style>
</head>
<body>
<nav class="nav">
  <span class="title">ADUE UI 对比</span>
  <a href="scheme-a.html" target="preview" class="active">方案A 极简暗色</a>
  <a href="scheme-a-supplement.html" target="preview">方案A 补充模块</a>
  <a href="scheme-a-supplement-v2.html" target="preview">方案A 补充v2</a>
  <a href="scheme-a-supplement-v3.html" target="preview">方案A 补充v3</a>
  <a href="scheme-a-data-mgmt.html" target="preview">方案A 数据管理</a>
  <a href="scheme-b.html" target="preview">方案B 极光风</a>
  <a href="scheme-c.html" target="preview">方案C 文档风</a>
  <a href="scheme-d.html" target="preview">方案D Apple风</a>
</nav>
<main>
  <iframe name="preview" src="scheme-a.html"></iframe>
</main>
<script>
document.querySelectorAll('.nav a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('.nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  });
});
</script>
</body>
</html>
